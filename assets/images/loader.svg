<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" fill="none" role="img" aria-label="Loading">
  <title>Loading</title>

  <!-- Eclipse Roofing inspired animated loader -->
  <g transform="translate(50 50)">
    <!-- Static roof -->
    <path d="M-30 2 L0-25 L30 2"
          stroke="#1A1A1A"
          stroke-width="7"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Animated roof highlight -->
    <path d="M-30 2 L0-25 L30 2"
          stroke="#FF5A00"
          stroke-width="7"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-dasharray="52 140"
          stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset"
               values="0;-192"
               dur="1.1s"
               repeatCount="indefinite"/>
    </path>

    <!-- House base -->
    <path d="M-20 0 V25 H20 V0"
          stroke="#1A1A1A"
          stroke-width="7"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Orange loading dot -->
    <circle cx="0" cy="37" r="5" fill="#FF5A00">
      <animate attributeName="r"
               values="4;6;4"
               dur="0.8s"
               repeatCount="indefinite"/>
      <animate attributeName="opacity"
               values="0.65;1;0.65"
               dur="0.8s"
               repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
